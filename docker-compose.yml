services:
  db:
    image: postgres:15
    container_name: trip-planner-db
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: tripplanner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      tags:
        - "trip-planner-api:${VERSION:-latest}"
        - "trip-planner-api:latest"
    image: trip-planner-api:${VERSION:-latest}
    container_name: trip-planner-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://tripplanner:mypassword@db:5432/tripplanner_db
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
