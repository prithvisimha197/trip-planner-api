openapi: 3.0.3
info:
  title: Trip Planner API
  description: |
    A comprehensive REST API for managing travel itineraries, destinations, and places.
    
    ## Features
    - User authentication with JWT tokens
    - Trip management (CRUD operations)
    - Places/activities within trips
    - Filtering, sorting, and pagination
    - Multi-step password recovery
    
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.tripplanner.com
    description: Production server

tags:
  - name: Health
    description: System health and status checks
  - name: Authentication
    description: User registration, login, and password management
  - name: Trips
    description: Trip planning and management
  - name: Places
    description: Places and activities within trips

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        dob:
          type: string
          format: date
          example: "1990-01-01"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        title:
          type: string
          example: "Summer Vacation 2024"
        destination:
          type: string
          example: "Paris, France"
        startDate:
          type: string
          format: date
          example: "2024-07-01"
        endDate:
          type: string
          format: date
          example: "2024-07-15"
        status:
          type: string
          enum: [upcoming, current, past]
          example: upcoming
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'

    Place:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tripId:
          type: integer
          example: 1
        name:
          type: string
          example: "Eiffel Tower"
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        error:
          type: string
          example: "An error occurred"

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: healthy
        timestamp:
          type: number
          example: 1705320000.123
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                response_time_ms:
                  type: number
                  example: 12.34
            application:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                environment:
                  type: string
                  example: development

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Check the health status of the API and database connection
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with email, password, date of birth, and security question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - dob
                - securityQuestion
                - securityAnswer
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
                securityQuestion:
                  type: string
                  example: "What is your favorite color?"
                securityAnswer:
                  type: string
                  example: "Blue"
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account created successfully"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve authenticated user's information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout current user (client should discard token)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"

  /api/auth/reset-password/verify-credentials:
    post:
      tags:
        - Authentication
      summary: Step 1 - Verify email and DOB for password reset
      description: First step of password recovery process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - dob
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '200':
          description: Credentials verified, returns security question
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Credentials verified"
                  securityQuestion:
                    type: string
                    example: "What is your favorite color?"
        '400':
          description: Missing required fields or invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Date of birth does not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/reset-password/verify-security-answer:
    post:
      tags:
        - Authentication
      summary: Step 2 - Verify security answer for password reset
      description: Second step of password recovery process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - securityAnswer
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                securityAnswer:
                  type: string
                  example: "Blue"
      responses:
        '200':
          description: Security answer verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Security answer verified"
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security answer is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Step 3 - Reset password
      description: Final step to reset password after all verifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - dob
                - securityAnswer
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
                securityAnswer:
                  type: string
                  example: "Blue"
                newPassword:
                  type: string
                  format: password
                  example: "NewSecurePass456!"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully"
        '400':
          description: Missing required fields or invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials (DOB or security answer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips:
    get:
      tags:
        - Trips
      summary: Get all trips
      description: Retrieve all trips for authenticated user with filtering, sorting, and pagination
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by trip status
          schema:
            type: string
            enum: [all, upcoming, current, past]
            default: all
        - name: search
          in: query
          description: Search trips by title or destination
          schema:
            type: string
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page (max 100)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Field to sort by
          schema:
            type: string
            enum: [start_date, end_date, title, destination, created_at]
            default: start_date
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of trips with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to fetch trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Trips
      summary: Create a new trip
      description: Create a new trip for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - destination
                - startDate
                - endDate
              properties:
                title:
                  type: string
                  example: "Summer Vacation 2024"
                destination:
                  type: string
                  example: "Paris, France"
                startDate:
                  type: string
                  format: date
                  example: "2024-07-01"
                endDate:
                  type: string
                  format: date
                  example: "2024-07-15"
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Missing required fields or invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/{trip_id}:
    get:
      tags:
        - Trips
      summary: Get a single trip
      description: Retrieve a specific trip with optional places included
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: Trip ID
          schema:
            type: integer
        - name: includePlaces
          in: query
          description: Include places in the response
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Trips
      summary: Update a trip
      description: Update an existing trip
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: Trip ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Summer Vacation"
                destination:
                  type: string
                  example: "Rome, Italy"
                startDate:
                  type: string
                  format: date
                  example: "2024-07-05"
                endDate:
                  type: string
                  format: date
                  example: "2024-07-20"
      responses:
        '200':
          description: Trip updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid date format or date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Trips
      summary: Delete a trip
      description: Delete a trip and all associated places
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: Trip ID
          schema:
            type: integer
      responses:
        '200':
          description: Trip deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Trip deleted successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/{trip_id}/places:
    get:
      tags:
        - Places
      summary: Get all places for a trip
      description: Retrieve all places/activities for a specific trip with filtering and pagination
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: Trip ID
          schema:
            type: integer
        - name: completed
          in: query
          description: Filter by completion status
          schema:
            type: boolean
        - name: search
          in: query
          description: Search places by name
          schema:
            type: string
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page (max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of places with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to fetch places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Places
      summary: Add a place to a trip
      description: Create a new place/activity for a specific trip
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: Trip ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Eiffel Tower"
                completed:
                  type: boolean
                  default: false
                  example: false
      responses:
        '201':
          description: Place created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/places/{place_id}:
    get:
      tags:
        - Places
      summary: Get a single place
      description: Retrieve details of a specific place
      security:
        - BearerAuth: []
      parameters:
        - name: place_id
          in: path
          required: true
          description: Place ID
          schema:
            type: integer
      responses:
        '200':
          description: Place details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Place belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Place not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Places
      summary: Update a place
      description: Update a place's name or completion status
      security:
        - BearerAuth: []
      parameters:
        - name: place_id
          in: path
          required: true
          description: Place ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Louvre Museum"
                completed:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Place updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Place belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Place not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Places
      summary: Partially update a place
      description: Update specific fields of a place (same as PUT)
      security:
        - BearerAuth: []
      parameters:
        - name: place_id
          in: path
          required: true
          description: Place ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Louvre Museum"
                completed:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Place updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Place belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Place not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Places
      summary: Delete a place
      description: Remove a place from a trip
      security:
        - BearerAuth: []
      parameters:
        - name: place_id
          in: path
          required: true
          description: Place ID
          schema:
            type: integer
      responses:
        '200':
          description: Place deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Place deleted successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Place belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Place not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
